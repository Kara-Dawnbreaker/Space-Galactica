<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="description" content="Space Galactica — a retro arcade survival shooter.">
<title>Space Galactica</title><link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app-shell">
<header class="topbar"><a class="brand" href="./">SPACE <span>GALACTICA</span></a><div class="topbar-actions"><span id="mode-label" class="mode-label">MODE SELECT</span><button id="pause-button" class="quiet-button" type="button" hidden>Pause</button></div></header>
<section class="game-frame" aria-label="Game area">
<canvas id="game-canvas" aria-label="Space Galactica game canvas"></canvas>
<section id="start-screen" class="screen-layer"><div class="panel"><p class="eyebrow">ARCADE SURVIVAL // PROTOTYPE</p><h1>SPACE<br><span>GALACTICA</span></h1><p class="intro">Choose your frontier.</p>
<div class="mode-buttons">
<button class="mode-button space-choice" data-mode="space" type="button"><span class="mode-icon" aria-hidden="true">✦</span><span><strong>DEEP SPACE</strong><small>Stars, distant worlds and the unknown</small></span></button>
<button class="mode-button sea-choice" data-mode="sea" type="button"><span class="mode-icon" aria-hidden="true">≈</span><span><strong>DEEP SEA</strong><small>Dark waters and strange depths</small></span></button>
</div><p class="control-hint">MOVE: WASD / ARROWS · TOUCH: DRAG ON THE PLAYFIELD</p></div></section>
<section id="pause-screen" class="screen-layer" hidden><div class="panel compact-panel"><p class="eyebrow">SYSTEM HALTED</p><h2>PAUSED</h2><p class="intro">Your run is waiting.</p><button id="resume-button" class="primary-button" type="button">RESUME</button><button id="restart-button" class="text-button" type="button">RESTART RUN</button></div></section>
</section>
<footer class="footerbar"><span>PHASE 01 // FOUNDATION</span><span id="status-label">AWAITING PILOT</span><span>BUILD 0.1</span></footer>
</main><script type="module" src="./src/main.js"></script>
</body></html>
